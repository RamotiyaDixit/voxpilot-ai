services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: voxpilot
      MYSQL_USER: voxpilot
      MYSQL_PASSWORD: voxpilot
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./apps/api/sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "voxpilot", "--password=voxpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
